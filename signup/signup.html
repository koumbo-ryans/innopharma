<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innopharma | Sign Up</title>
  <link rel="stylesheet" href="/signup/signup.css">
</head>
<body>
  <div class="container">
    <div class="form-card">
      <h1>Join Innopharma</h1>
      <p class="subtitle">Create your account and explore pharmacies world wide.</p>

      <form action="#" method="POST" class="signup-form">
        <div class="input-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Etienne Ryann" required>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@gmail.com" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="********" required>
        </div>

        <div class="input-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="********" required>
        </div>

        <button type="submit" class="btn">Sign Up</button>

        <p class="login-link">
          Already have an account? <a href="#">Log in</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
